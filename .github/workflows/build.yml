name: Build SRT Store IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Build Xcode Archive
        run: |
          xcodebuild archive \
            -project SRTStore.xcodeproj \
            -scheme SRTStore \
            -sdk iphoneos \
            -archivePath build/SRTStore.xcarchive \
            CODE_SIGNING_ALLOWED=NO

      - name: Package to IPA
        run: |
          mkdir -p build/Payload
          cp -R build/SRTStore.xcarchive/Products/Applications/SRTStore.app build/Payload/
          cd build
          zip -r SRTStore.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SRTStore-IPA
          path: build/SRTStore.ipa
