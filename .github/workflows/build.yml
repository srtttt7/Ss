name: Build SRT Store IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Create Temporary Xcode Project
        run: |
          swift package init --type executable --name SRTStore
          mkdir -p SRTStore.xcodeproj
          if [ -f "ContentView.swift" ]; then
            mkdir -p SRTStore/Sources/SRTStore
            mv ContentView.swift SRTStore/Sources/SRTStore/main.swift
          fi

      - name: Build Project
        run: |
          cd SRTStore
          swift build -c release

      - name: Create IPA Structure
        run: |
          mkdir -p build/Payload
          mkdir -p build/Payload/SRTStore.app
          echo "APPL????" > build/Payload/SRTStore.app/PkgInfo
          cd build
          zip -r SRTStore.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SRTStore-IPA
          path: build/SRTStore.ipa
