name: Build SRT Store IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Compile Real Mach-O Binary & Create IPA
        run: |
          APP_NAME="SRTStore"
          BUNDLE_ID="com.srtttt7.srtstore"
          
          # 1. إنشاء مجلد الحزمة
          mkdir -p build/Payload/${APP_NAME}.app
          echo "APPL????" > build/Payload/${APP_NAME}.app/PkgInfo

          # 2. إنشاء كود Swift مصغر وترجمته إلى ملف تنفيذي حقيقي Mach-O معتمد للأيفون
          cat << 'EOF' > main.swift
          import UIKit

          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?
              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  window = UIWindow(frame: UIScreen.main.bounds)
                  let vc = UIViewController()
                  vc.view.backgroundColor = .black
                  window?.rootViewController = vc
                  window?.makeKeyAndVisible()
                  return true
              }
          }

          UIApplicationMain(CommandLine.argc, CommandLine.unsafeArgv, nil, NSStringFromClass(AppDelegate.self))
          EOF

          # ترجمة الكود لملف ثنائي Mach-O حقيقي مخصص لمعمارية iOS (arm64)
          xcrun --sdk iphoneos swiftc -target arm64-apple-ios15.0 main.swift -o build/Payload/${APP_NAME}.app/${APP_NAME}

          # 3. إنشاء ملف Info.plist الشامل واليدوي
          cat << 'EOF' > build/Payload/${APP_NAME}.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.srtttt7.srtstore</string>
              <key>CFBundleName</key>
              <string>SRTStore</string>
              <key>CFBundleDisplayName</key>
              <string>SRT STORE</string>
              <key>CFBundleExecutable</key>
              <string>SRTStore</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
                  <integer>2</integer>
              </array>
          </dict>
          </plist>
          EOF

          # 4. ضغط المجلد بصيغة IPA
          cd build
          zip -r SRTStore.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SRTStore-IPA
          path: build/SRTStore.ipa
