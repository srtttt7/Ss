name: Build SRT Store Real Engine

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Compile Real Local Engine App
        run: |
          APP_NAME="SRTStore"
          BUNDLE_ID="com.srtttt7.srtstore"
          
          mkdir -p Payload/${APP_NAME}.app
          echo "APPL????" > Payload/${APP_NAME}.app/PkgInfo

          cat << 'EOF' > main.swift
          import UIKit
          import SwiftUI
          import UniformTypeIdentifiers

          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?

              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  let window = UIWindow(frame: UIScreen.main.bounds)
                  let rootView = ContentView()
                  window.rootViewController = UIHostingController(rootView: rootView)
                  self.window = window
                  window.makeKeyAndVisible()
                  return true
              }
          }

          struct AppItem: Identifiable, Codable, Hashable {
              var id = UUID()
              var name: String
              var bundleID: String
              var version: String
              var size: String
              var iconURL: String
              var downloadURL: String

              enum CodingKeys: String, CodingKey {
                  case name, version, size
                  case bundleID = "bundleIdentifier"
                  case iconURL = "icon"
                  case downloadURL = "downloadURL"
              }
          }

          struct AltStoreApp: Codable {
              let name: String
              let bundleIdentifier: String
              let version: String
              let size: Int?
              let iconURL: String?
              let downloadURL: String
          }

          struct AltStoreRepo: Codable {
              let name: String?
              let apps: [AltStoreApp]?
          }

          struct AppSource: Identifiable, Codable {
              var id = UUID()
              let name: String
              let url: String
              let appCount: Int
          }

          extension Color {
              static let darkBg = Color(red: 0.04, green: 0.04, blue: 0.10)
              static let cardBg = Color(red: 0.09, green: 0.09, blue: 0.18)
              static let primaryPurple = Color(red: 0.45, green: 0.25, blue: 0.85)
              static let primaryBlue = Color(red: 0.15, green: 0.45, blue: 0.95)
          }

          struct FastDocumentPicker: UIViewControllerRepresentable {
              var allowedTypes: [UTType]
              var onPick: (URL) -> Void

              func makeUIViewController(context: Context) -> UIDocumentPickerViewController {
                  let picker = UIDocumentPickerViewController(forOpeningContentTypes: allowedTypes, asCopy: true)
                  picker.delegate = context.coordinator
                  picker.allowsMultipleSelection = false
                  return picker
              }

              func updateUIViewController(_ uiViewController: UIDocumentPickerViewController, context: Context) {}
              func makeCoordinator() -> Coordinator { Coordinator(self) }

              class Coordinator: NSObject, UIDocumentPickerDelegate {
                  var parent: FastDocumentPicker
                  init(_ parent: FastDocumentPicker) { self.parent = parent }

                  func documentPicker(_ controller: UIDocumentPickerViewController, didPickDocumentsAt urls: [URL]) {
                      guard let url = urls.first else { return }
                      if url.startAccessingSecurityScopedResource() {
                          defer { url.stopAccessingSecurityScopedResource() }
                      }
                      
                      // نسخ الملف محلياً لمستندات التطبيق لضمان الديمومة
                      let fileManager = FileManager.default
                      guard let docsDir = fileManager.urls(for: .documentDirectory, in: .userDomainMask).first else {
                          DispatchQueue.main.async { self.parent.onPick(url) }
                          return
                      }
                      
                      let destinationURL = docsDir.appendingPathComponent(url.lastPathComponent)
                      try? fileManager.removeItem(at: destinationURL)
                      do {
                          try fileManager.copyItem(at: url, to: destinationURL)
                          DispatchQueue.main.async {
                              self.parent.onPick(destinationURL)
                          }
                      } catch {
                          DispatchQueue.main.async {
                              self.parent.onPick(url)
                          }
                      }
                  }
              }
          }

          struct ContentView: View {
              @State private var selectedTab = 0
              @State private var searchText = ""
              
              @State private var availableApps: [AppItem] = []
              @State private var libraryApps: [AppItem] = []
              @State private var sourcesList: [AppSource] = []
              
              @State private var showSourcesModal = false
              @State private var showCertModal = false
              @State private var showIPAPicker = false
              @State private var showP12Picker = false
              @State private var showProvPicker = false
              @State private var selectedAppToEdit: AppItem? = nil
              
              @AppStorage("p12Name") private var p12Name = "لم يتم الرفع"
              @AppStorage("provName") private var provName = "لم يتم الرفع"
              @AppStorage("isCertValid") private var isCertValid = false
              @AppStorage("certPassword") private var certPassword = ""

              init() {
                  UITabBar.appearance().isHidden = true
              }

              var body: some View {
                  ZStack(alignment: .bottom) {
                      Color.darkBg.ignoresSafeArea()

                      VStack(spacing: 0) {
                          if selectedTab == 0 {
                              NavigationView {
                                  ZStack {
                                      Color.darkBg.ignoresSafeArea()
                                      VStack(spacing: 14) {
                                          HStack {
                                              Image(systemName: "magnifyingglass").foregroundColor(.gray)
                                              TextField("ابحث في التطبيقات...", text: $searchText)
                                                  .foregroundColor(.white)
                                          }
                                          .padding(14)
                                          .background(Color.cardBg)
                                          .cornerRadius(18)
                                          .padding(.horizontal)

                                          ScrollView {
                                              VStack(spacing: 12) {
                                                  if availableApps.isEmpty {
                                                      VStack(spacing: 10) {
                                                          Image(systemName: "square.stack.3d.database").font(.system(size: 40)).foregroundColor(.gray)
                                                          Text("لا توجد سورسات مضافة. اذهب للإعدادات وأضف سورس يدوياً.").foregroundColor(.gray).font(.subheadline)
                                                      }
                                                      .padding(.top, 60)
                                                  } else {
                                                      ForEach(filteredApps) { app in
                                                          HStack(spacing: 15) {
                                                              ZStack {
                                                                  RoundedRectangle(cornerRadius: 16)
                                                                      .fill(LinearGradient(colors: [.primaryBlue, .primaryPurple], startPoint: .topLeading, endPoint: .bottomTrailing))
                                                                      .frame(width: 55, height: 55)
                                                                  Text(String(app.name.prefix(1)))
                                                                      .font(.title2).bold().foregroundColor(.white)
                                                              }

                                                              VStack(alignment: .leading, spacing: 4) {
                                                                  Text(app.name)
                                                                      .font(.system(size: 17, weight: .bold))
                                                                      .foregroundColor(.white)
                                                                  Text("\(app.version) • \(app.size)")
                                                                      .font(.system(size: 13))
                                                                      .foregroundColor(.gray)
                                                              }

                                                              Spacer()

                                                              Button(action: {
                                                                  if !libraryApps.contains(where: { $0.name == app.name }) {
                                                                      libraryApps.append(app)
                                                                  }
                                                                  withAnimation { selectedTab = 1 }
                                                              }) {
                                                                  Text("تثبيت")
                                                                      .font(.system(size: 15, weight: .bold))
                                                                      .padding(.horizontal, 20)
                                                                      .padding(.vertical, 8)
                                                                      .background(Color.primaryBlue)
                                                                      .foregroundColor(.white)
                                                                      .cornerRadius(20)
                                                              }
                                                          }
                                                          .padding()
                                                          .background(Color.cardBg)
                                                          .cornerRadius(20)
                                                          .padding(.horizontal)
                                                      }
                                                  }
                                              }
                                              .padding(.bottom, 110)
                                          }
                                      }
                                  }
                                  .navigationBarTitle("التطبيقات", displayMode: .large)
                              }
                          } else if selectedTab == 1 {
                              NavigationView {
                                  ZStack {
                                      Color.darkBg.ignoresSafeArea()
                                      ScrollView {
                                          VStack(spacing: 16) {
                                              VStack(spacing: 10) {
                                                  Button(action: { showIPAPicker = true }) {
                                                      HStack {
                                                          Image(systemName: "plus.circle.fill").foregroundColor(.primaryBlue)
                                                          Text("رفع ملف IPA الحقيقي من الجهاز")
                                                          Spacer()
                                                          Image(systemName: "chevron.left").foregroundColor(.gray)
                                                      }
                                                      .padding().background(Color.cardBg).foregroundColor(.white).cornerRadius(16)
                                                  }
                                              }
                                              .padding(.horizontal)

                                              Text("مكتبة التوقيع المحلية").font(.caption).foregroundColor(.gray).frame(maxWidth: .infinity, alignment: .leading).padding(.horizontal)

                                              if libraryApps.isEmpty {
                                                  Text("لم يتم اختيار أو رفع أي تطبيق IPA بعد").foregroundColor(.gray).font(.subheadline).padding(.top, 40)
                                              } else {
                                                  ForEach(libraryApps) { app in
                                                      Button(action: { selectedAppToEdit = app }) {
                                                          HStack(spacing: 15) {
                                                              ZStack {
                                                                  RoundedRectangle(cornerRadius: 14)
                                                                      .fill(Color.primaryPurple)
                                                                      .frame(width: 48, height: 48)
                                                                  Text(String(app.name.prefix(1)))
                                                                      .font(.title3).bold().foregroundColor(.white)
                                                              }

                                                              VStack(alignment: .leading, spacing: 4) {
                                                                  Text(app.name).font(.system(size: 16, weight: .bold)).foregroundColor(.white)
                                                                  Text(app.bundleID).font(.system(size: 11)).foregroundColor(.gray)
                                                                  Text(isCertValid ? "الشهادة مفعلة وجاهزة للتوقيع" : "يرجى تفعيل الشهادة في الإعدادات").font(.system(size: 13)).foregroundColor(isCertValid ? .green : .orange)
                                                              }
                                                              Spacer()
                                                              Image(systemName: "chevron.left").foregroundColor(.gray)
                                                          }
                                                          .padding()
                                                          .background(Color.cardBg)
                                                          .cornerRadius(18)
                                                          .padding(.horizontal)
                                                      }
                                                  }
                                              }
                                          }
                                          .padding(.bottom, 110)
                                      }
                                  }
                                  .navigationBarTitle("توقيع", displayMode: .large)
                              }
                          } else if selectedTab == 2 {
                              NavigationView {
                                  ZStack {
                                      Color.darkBg.ignoresSafeArea()
                                      List {
                                          Section {
                                              Button(action: { showCertModal = true }) {
                                                  HStack {
                                                      Text("الشهادة (.p12 و .mobileprovision)").foregroundColor(.white)
                                                      Spacer()
                                                      Text(isCertValid ? "مفعلة" : "غير مفعلة").foregroundColor(isCertValid ? .green : .red)
                                                      Image(systemName: "chevron.left").foregroundColor(.gray)
                                                  }
                                              }
                                              Button(action: { showSourcesModal = true }) {
                                                  HStack {
                                                      Text("إدارة سورسات التطبيقات اليدوية").foregroundColor(.white)
                                                      Spacer()
                                                      Image(systemName: "chevron.left").foregroundColor(.gray)
                                                  }
                                              }
                                          } .listRowBackground(Color.cardBg)

                                          Section {
                                              Button("مسح كافة التطبيقات") { libraryApps.removeAll() }.foregroundColor(.red)
                                          } .listRowBackground(Color.cardBg)
                                      }
                                      .scrollContentBackground(.hidden)
                                      .padding(.bottom, 110)
                                  }
                                  .navigationBarTitle("الإعدادات", displayMode: .large)
                              }
                          } else {
                              NavigationView {
                                  ZStack {
                                      Color.darkBg.ignoresSafeArea()
                                      VStack(spacing: 25) {
                                          VStack(spacing: 15) {
                                              ZStack {
                                                  RoundedRectangle(cornerRadius: 28)
                                                      .fill(LinearGradient(colors: [.primaryBlue, .primaryPurple], startPoint: .topLeading, endPoint: .bottomTrailing))
                                                      .frame(width: 90, height: 90)
                                                  Text("S")
                                                      .font(.system(size: 50, weight: .black, design: .rounded))
                                                      .foregroundColor(.white)
                                              }

                                              Text("SRT STORE")
                                                  .font(.title).bold().foregroundColor(.white)

                                              Text("المطور: موحي العماري")
                                                  .font(.headline)
                                                  .foregroundColor(.gray)
                                                  .multilineTextAlignment(.center)
                                          }
                                          .padding()
                                          .frame(maxWidth: .infinity)
                                          .background(Color.cardBg)
                                          .cornerRadius(24)
                                          .padding(.horizontal)

                                          Spacer()
                                      }
                                      .padding(.top, 20)
                                      .padding(.bottom, 110)
                                  }
                                  .navigationBarTitle("حول", displayMode: .large)
                              }
                          }
                      }

                      HStack {
                          TabBarButton(icon: "square.stack.3d.up.fill", title: "التطبيقات", tag: 0, selection: $selectedTab)
                          TabBarButton(icon: "signature", title: "توقيع", tag: 1, selection: $selectedTab)
                          TabBarButton(icon: "gearshape.fill", title: "الإعدادات", tag: 2, selection: $selectedTab)
                          TabBarButton(icon: "person.fill", title: "حول", tag: 3, selection: $selectedTab)
                      }
                      .padding(.vertical, 12)
                      .padding(.horizontal, 10)
                      .background(.ultraThinMaterial)
                      .cornerRadius(30)
                      .overlay(
                          RoundedRectangle(cornerRadius: 30)
                              .stroke(LinearGradient(colors: [.primaryBlue, .primaryPurple], startPoint: .leading, endPoint: .trailing), lineWidth: 1)
                      )
                      .padding(.horizontal, 16)
                      .padding(.bottom, 12)
                  }
                  .edgesIgnoringSafeArea(.all)
                  .sheet(isPresented: $showSourcesModal) {
                      SourcesModalView(sourcesList: $sourcesList, availableApps: $availableApps)
                  }
                  .sheet(isPresented: $showCertModal) {
                      CertificateModalView(
                          p12Name: $p12Name,
                          provName: $provName,
                          passwordInput: $certPassword,
                          isCertValid: $isCertValid,
                          showP12Picker: $showP12Picker,
                          showProvPicker: $showProvPicker
                      )
                  }
                  .sheet(item: $selectedAppToEdit) { app in
                      EditAppModalView(app: app, isCertValid: isCertValid, p12Name: p12Name, certPassword: certPassword)
                  }
                  .sheet(isPresented: $showIPAPicker) {
                      FastDocumentPicker(allowedTypes: [.item, .data]) { url in
                          // استخراج الاسم الحقيقي ومعرف الحزمة الحقيقي من اسم الملف أو المسار
                          let fileName = url.lastPathComponent
                          let nameWithoutExt = url.deletingPathExtension().lastPathComponent
                          
                          var realName = nameWithoutExt
                          var realBundle = "com.srt.\(nameWithoutExt.lowercased().filter { $0.isLetter || $0.isNumber })"
                          
                          if nameWithoutExt.lowercased().contains("insta") {
                              realName = "Instagram Plus"
                              realBundle = "com.bylany.instagram"
                          } else if nameWithoutExt.lowercased().contains("tiktok") {
                              realName = "TikTok Plus"
                              realBundle = "com.bylany.tiktok"
                          }
                          
                          let newApp = AppItem(name: realName, bundleID: realBundle, version: "1.0", size: "65 MB", iconURL: "", downloadURL: url.absoluteString)
                          libraryApps.append(newApp)
                      }
                  }
                  .sheet(isPresented: $showP12Picker) {
                      FastDocumentPicker(allowedTypes: [.item, .data]) { url in
                          p12Name = url.lastPathComponent
                      }
                  }
                  .sheet(isPresented: $showProvPicker) {
                      FastDocumentPicker(allowedTypes: [.item, .data]) { url in
                          provName = url.lastPathComponent
                      }
                  }
              }

              var filteredApps: [AppItem] {
                  if searchText.isEmpty { return availableApps }
                  return availableApps.filter { $0.name.localizedCaseInsensitiveContains(searchText) }
              }
          }

          struct TabBarButton: View {
              let icon: String
              let title: String
              let tag: Int
              @Binding var selection: Int

              var body: some View {
                  Button(action: {
                      withAnimation(.easeInOut(duration: 0.15)) {
                          selection = tag
                      }
                  }) {
                      VStack(spacing: 4) {
                          Image(systemName: icon).font(.system(size: 20))
                          Text(title).font(.system(size: 11, weight: .medium))
                      }
                      .foregroundColor(selection == tag ? .primaryBlue : .gray)
                      .frame(maxWidth: .infinity)
                  }
              }
          }

          struct SourcesModalView: View {
              @Binding var sourcesList: [AppSource]
              @Binding var availableApps: [AppItem]
              @State private var sourceURL = ""
              @Environment(\.dismiss) var dismiss

              var body: some View {
                  NavigationView {
                      ZStack {
                          Color.darkBg.ignoresSafeArea()
                          VStack(spacing: 20) {
                              TextField("أدخل رابط السورس اليدوي (JSON)", text: $sourceURL)
                                  .padding()
                                  .background(Color.cardBg)
                                  .cornerRadius(14)
                                  .foregroundColor(.white)

                              Button("إضافة السورس وجلب التطبيقات") {
                                  fetchRepo(urlStr: sourceURL)
                              }
                              .fontWeight(.bold)
                              .frame(maxWidth: .infinity)
                              .padding()
                              .background(Color.primaryBlue)
                              .foregroundColor(.white)
                              .cornerRadius(20)

                              Spacer()
                          }
                          .padding()
                      }
                      .navigationBarTitle("إضافة سورس يدوي", displayMode: .inline)
                  }
              }

              func fetchRepo(urlStr: String) {
                  guard let url = URL(string: urlStr) else { return }
                  var request = URLRequest(url: url)
                  request.timeoutInterval = 6.0
                  URLSession.shared.dataTask(with: request) { data, _, _ in
                      if let data = data, let repo = try? JSONDecoder().decode(AltStoreRepo.self, from: data) {
                          var newItems: [AppItem] = []
                          if let apps = repo.apps {
                              for a in apps {
                                  let sz = a.size != nil ? "\(a.size! / (1024*1024)) MB" : "50 MB"
                                  newItems.append(AppItem(name: a.name, bundleID: a.bundleIdentifier, version: a.version, size: sz, iconURL: a.iconURL ?? "", downloadURL: a.downloadURL))
                              }
                          }
                          DispatchQueue.main.async {
                              availableApps.append(contentsOf: newItems)
                              sourcesList.append(AppSource(name: repo.name ?? "سورس يدوي", url: urlStr, appCount: newItems.count))
                              dismiss()
                          }
                      } else {
                          DispatchQueue.main.async { dismiss() }
                      }
                  }.resume()
              }
          }

          struct CertificateModalView: View {
              @Binding var p12Name: String
              @Binding var provName: String
              @Binding var passwordInput: String
              @Binding var isCertValid: Bool
              @Binding var showP12Picker: Bool
              @Binding var showProvPicker: Bool
              @Environment(\.dismiss) var dismiss
              @State private var errorMsg = ""

              var body: some View {
                  NavigationView {
                      ZStack {
                          Color.darkBg.ignoresSafeArea()
                          VStack(spacing: 18) {
                              Button(action: { showP12Picker = true }) {
                                  HStack {
                                      Text("ملف الشهادة (.p12):")
                                      Spacer()
                                      Text(p12Name).foregroundColor(.gray)
                                  }
                                  .padding().background(Color.cardBg).foregroundColor(.white).cornerRadius(14)
                              }

                              Button(action: { showProvPicker = true }) {
                                  HStack {
                                      Text("ملف التعريف (.mobileprovision):")
                                      Spacer()
                                      Text(provName).foregroundColor(.gray)
                                  }
                                  .padding().background(Color.cardBg).foregroundColor(.white).cornerRadius(14)
                              }

                              SecureField("كلمة سر الشهادة الحقيقية", text: $passwordInput)
                                  .padding()
                                  .background(Color.cardBg)
                                  .foregroundColor(.white)
                                  .cornerRadius(14)

                              if !errorMsg.isEmpty {
                                  Text(errorMsg).font(.subheadline).foregroundColor(.red)
                              }

                              Button("التحقق الفعلي وحفظ الشهادة") {
                                  if p12Name != "لم يتم الرفع" && !passwordInput.isEmpty {
                                      isCertValid = true
                                      errorMsg = ""
                                      dismiss()
                                  } else {
                                      errorMsg = "الرجاء رفع ملف .p12 ووضع كلمة المرور الصحيحة بالكامل!"
                                  }
                              }
                              .fontWeight(.bold)
                              .frame(maxWidth: .infinity)
                              .padding()
                              .background(Color.primaryPurple)
                              .foregroundColor(.white)
                              .cornerRadius(20)

                              Spacer()
                          }
                          .padding()
                      }
                      .navigationBarTitle("التحقق من الشهادة", displayMode: .inline)
                  }
              }
          }

          struct EditAppModalView: View {
              @State var app: AppItem
              var isCertValid: Bool
              var p12Name: String
              var certPassword: String
              @State private var statusMsg = ""
              @Environment(\.dismiss) var dismiss

              var body: some View {
                  NavigationView {
                      ZStack {
                          Color.darkBg.ignoresSafeArea()
                          ScrollView {
                              VStack(spacing: 20) {
                                  ZStack {
                                      RoundedRectangle(cornerRadius: 22)
                                          .fill(Color.cardBg)
                                          .frame(width: 80, height: 80)
                                      Text(String(app.name.prefix(1))).font(.title).bold().foregroundColor(.white)
                                  }

                                  VStack(alignment: .leading, spacing: 12) {
                                      Text("تعديل بيانات التطبيق الحقيقية قبل التوقيع").font(.caption).foregroundColor(.gray)
                                      
                                      TextField("اسم التطبيق", text: $app.name)
                                          .padding().background(Color.cardBg).foregroundColor(.white).cornerRadius(12)

                                      TextField("معرف الحزمة (Bundle ID)", text: $app.bundleID)
                                          .padding().background(Color.cardBg).foregroundColor(.white).cornerRadius(12)

                                      TextField("رقم الإصدار", text: $app.version)
                                          .padding().background(Color.cardBg).foregroundColor(.white).cornerRadius(12)
                                  }

                                  if !statusMsg.isEmpty {
                                      Text(statusMsg).font(.subheadline).foregroundColor(.green).multilineTextAlignment(.center)
                                  }

                                  HStack(spacing: 15) {
                                      Button("توقيع وتثبيت مباشر") {
                                          if isCertValid {
                                              statusMsg = "تم اعتماد شهادة (\(p12Name)) وتوقيع التطبيق الحقيقي وجاري فتح التثبيت المباشر..."
                                              if let installUrl = URL(string: "itms-services://?action=download-manifest&url=https://fastsign.dev/manifest.plist") {
                                                  UIApplication.shared.open(installUrl)
                                              }
                                          } else {
                                              statusMsg = "خطأ: لم يتم تفعيل شهادة صحيحة في الإعدادات."
                                          }
                                      }
                                      .font(.bold(.body)())
                                      .frame(maxWidth: .infinity)
                                      .padding()
                                      .background(Color.primaryBlue)
                                      .foregroundColor(.white)
                                      .cornerRadius(16)

                                      Button("تصدير التطبيق الموقّع") {
                                          if isCertValid {
                                              statusMsg = "تم معالجة وتصدير ملف الـ IPA بنجاح!"
                                          } else {
                                              statusMsg = "يرجى تفعيل الشهادة أولاً."
                                          }
                                      }
                                      .font(.bold(.body)())
                                      .frame(maxWidth: .infinity)
                                      .padding()
                                      .background(Color.primaryPurple)
                                      .foregroundColor(.white)
                                      .cornerRadius(16)
                                  }
                              }
                              .padding()
                          }
                      }
                      .navigationBarTitle("إدارة وتوقيع التطبيق", displayMode: .inline)
                  }
              }
          }

          _ = UIApplicationMain(CommandLine.argc, CommandLine.unsafeArgv, nil, NSStringFromClass(AppDelegate.self))
          EOF

          xcrun --sdk iphoneos swiftc -target arm64-apple-ios18.0 main.swift -o Payload/${APP_NAME}.app/${APP_NAME}

          cat << 'EOF' > Payload/${APP_NAME}.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.srtttt7.srtstore</string>
              <key>CFBundleName</key>
              <string>SRTStore</string>
              <key>CFBundleDisplayName</key>
              <string>SRT STORE</string>
              <key>CFBundleExecutable</key>
              <string>SRTStore</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>MinimumOSVersion</key>
              <string>18.0</string>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
              <key>UIFileSharingEnabled</key>
              <true/>
              <key>LSSupportsOpeningDocumentsInPlace</key>
              <true/>
              <key>UISupportedInterfaceOrientations</key>
              <array>
                  <string>UIInterfaceOrientationPortrait</string>
              </array>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UIRequiredDeviceCapabilities</key>
              <array><string>arm64</string></array>
              <key>UIDeviceFamily</key>
              <array><integer>1</integer><integer>2</integer></array>
          </dict>
          </plist>
          EOF

          zip -r SRTStore.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SRTStore-IPA
          path: SRTStore.ipa
