name: iOS Signed Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Import Certificate and Provisioning Profile
        env:
          CERT_P12_BASE64: ${{ secrets.IOS_CERT_P12_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          # Create temporary keychain
          security create-keychain -p actions temp.keychain
          security default-keychain -s temp.keychain
          security unlock-keychain -p actions temp.keychain
          security set-keychain-settings -t 3600 -u temp.keychain

          # Import .p12 certificate
          echo "$CERT_P12_BASE64" | base64 -d > cert.p12
          security import cert.p12 -k temp.keychain -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k actions temp.keychain

          # Install provisioning profile
          echo "$PROFILE_BASE64" | base64 -d > profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build and Sign
        run: |
          # If you already have a pre-built .ipa file, you can use the following command instead:
          # codesign -f -s "Apple Distribution" --entitlements entitlements.plist YourApp.ipa
          #
          # If you need to compile from source, use xcodebuild:
          # xcodebuild -workspace YourApp.xcworkspace -scheme YourApp -configuration Release \
          #   -archivePath build/YourApp.xcarchive archive \
          #   CODE_SIGN_IDENTITY="Apple Distribution" \
          #   PROVISIONING_PROFILE_SPECIFIER="Your Profile Name"
          #
          # Then export the .ipa:
          # xcodebuild -exportArchive -archivePath build/YourApp.xcarchive \
          #   -exportPath build/ \
          #   -exportOptionsPlist ExportOptions.plist
          echo "Build step placeholder - modify according to your project structure"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: signed-ipa
          path: build/*.ipa
