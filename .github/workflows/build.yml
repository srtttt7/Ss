name: Build SRT Store IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Compile Full SRT Store App & Build IPA
        run: |
          APP_NAME="SRTStore"
          BUNDLE_ID="com.srtttt7.srtstore"
          
          mkdir -p build/Payload/${APP_NAME}.app
          echo "APPL????" > build/Payload/${APP_NAME}.app/PkgInfo

          cat << 'EOF' > main.swift
          import UIKit
          import SwiftUI
          import UniformTypeIdentifiers

          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?

              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  let window = UIWindow(frame: UIScreen.main.bounds)
                  let rootView = ContentView()
                  window.rootViewController = UIHostingController(rootView: rootView)
                  self.window = window
                  window.makeKeyAndVisible()
                  return true
              }
          }

          // MARK: - Data Models
          struct AppItem: Identifiable, Codable {
              var id = UUID()
              let name: String
              let bundleID: String
              let version: String
              let size: String
              let iconURL: String
              let downloadURL: String

              enum CodingKeys: String, CodingKey {
                  case name, version, size
                  case bundleID = "bundleIdentifier"
                  case iconURL = "icon"
                  case downloadURL = "downloadURL"
              }
          }

          struct AppSource: Identifiable, Codable {
              var id = UUID()
              let name: String
              let url: String
              let appCount: Int
          }

          // MARK: - Main ContentView
          struct ContentView: View {
              @State private var selectedTab = 0
              @State private var searchText = ""
              
              @State private var availableApps: [AppItem] = []
              @State private var libraryApps: [AppItem] = []
              @State private var sourcesList: [AppSource] = []
              
              @State private var showSourcesModal = false
              @State private var showCertModal = false
              @State private var showFileImporter = false
              
              // بيانات الشهادة والأداة
              @State private var p12FileName = "لم يتم الرفع"
              @State private var mobileProvFileName = "لم يتم الرفع"
              @State private var certPasswordInput = ""
              @State private var certStatusMessage = "لم يتم إعداد الشهادة بعد"
              @State private var isCertValid = false

              init() {
                  UITabBar.appearance().isHidden = true
              }

              var body: some View {
                  ZStack(alignment: .bottom) {
                      TabView(selection: $selectedTab) {
                          // 1. App Store (التطبيقات)
                          NavigationView {
                              VStack(spacing: 12) {
                                  HStack(spacing: 10) {
                                      Button(action: { showSourcesModal = true }) {
                                          HStack {
                                              Image(systemName: "plus.circle.fill")
                                              Text("إضافة سورس")
                                          }
                                          .font(.system(size: 15, weight: .bold))
                                          .padding(.horizontal, 14)
                                          .padding(.vertical, 12)
                                          .background(Color.blue)
                                          .foregroundColor(.white)
                                          .cornerRadius(14)
                                      }

                                      HStack {
                                          Image(systemName: "magnifyingglass")
                                              .foregroundColor(.gray)
                                          TextField("بحث في التطبيقات والألعاب...", text: $searchText)
                                              .font(.system(size: 15))
                                              .foregroundColor(.white)
                                      }
                                      .padding(12)
                                      .background(Color(white: 0.15))
                                      .cornerRadius(14)
                                  }
                                  .padding(.horizontal)
                                  .padding(.top, 10)

                                  if filteredApps.isEmpty {
                                      Spacer()
                                      VStack(spacing: 15) {
                                          Image(systemName: "square.stack.3d.up.slash")
                                              .font(.system(size: 65))
                                              .foregroundColor(.gray)
                                          Text("قائمة التطبيقات فارغة")
                                              .font(.title3)
                                              .bold()
                                              .foregroundColor(.white)
                                          Text("اضغط على زر 'إضافة سورس' بالكتل الأزرق بالأعلى لإضافة رابط JSON وجلب التطبيقات.")
                                              .font(.subheadline)
                                              .foregroundColor(.gray)
                                              .multilineTextAlignment(.center)
                                              .padding(.horizontal, 40)
                                      }
                                      Spacer()
                                  } else {
                                      List(filteredApps) { app in
                                          HStack(spacing: 14) {
                                              VStack(alignment: .leading, spacing: 6) {
                                                  Text(app.name)
                                                      .font(.system(size: 17, weight: .semibold))
                                                      .foregroundColor(.white)
                                                  Text("\(app.version) • \(app.size)")
                                                      .font(.system(size: 14))
                                                      .foregroundColor(.gray)
                                              }
                                              Spacer()
                                              Button(action: {
                                                  if !libraryApps.contains(where: { $0.id == app.id }) {
                                                      libraryApps.append(app)
                                                  }
                                                  selectedTab = 3
                                              }) {
                                                  Text("تحميل")
                                                      .font(.system(size: 15, weight: .bold))
                                                      .padding(.horizontal, 18)
                                                      .padding(.vertical, 9)
                                                      .background(Color.blue)
                                                      .foregroundColor(.white)
                                                      .cornerRadius(20)
                                              }
                                          }
                                          .padding(.vertical, 4)
                                          .listRowBackground(Color.clear)
                                      }
                                      .listStyle(PlainListStyle())
                                  }
                              }
                              .navigationBarTitle("التطبيقات", displayMode: .large)
                          }
                          .tag(0)

                          // 2. توقيع
                          NavigationView {
                              VStack(spacing: 20) {
                                  VStack(spacing: 15) {
                                      Image(systemName: "pencil.tip.crop.circle.badge.plus")
                                          .font(.system(size: 60))
                                          .foregroundColor(.blue)
                                      Text("أداة توقيع التطبيقات")
                                          .font(.title2)
                                          .bold()
                                      Text("حالة الشهادة الحالية: \(certStatusMessage)")
                                          .font(.subheadline)
                                          .foregroundColor(isCertValid ? .green : .red)
                                  }
                                  .padding()
                                  .frame(maxWidth: .infinity)
                                  .background(Color(white: 0.12))
                                  .cornerRadius(20)
                                  .padding(.horizontal)

                                  Button(action: { showCertModal = true }) {
                                      HStack {
                                          Image(systemName: "key.fill")
                                          Text("إدارة ورفع الشهادة (.p12)")
                                      }
                                      .font(.system(size: 16, weight: .bold))
                                      .frame(maxWidth: .infinity)
                                      .padding(.vertical, 14)
                                      .background(Color.blue)
                                      .foregroundColor(.white)
                                      .cornerRadius(16)
                                  }
                                  .padding(.horizontal)

                                  Spacer()
                              }
                              .padding(.top, 10)
                              .navigationBarTitle("توقيع", displayMode: .large)
                          }
                          .tag(1)

                          // 3. الإعدادات
                          NavigationView {
                              List {
                                  Section(header: Text("إدارة الشهادة")) {
                                      Button(action: { showCertModal = true }) {
                                          HStack {
                                              Text("شهادة التوقيع (.p12 & Profile)")
                                                  .font(.system(size: 16))
                                              Spacer()
                                              Image(systemName: "chevron.left").foregroundColor(.gray)
                                          }
                                          .padding(.vertical, 4)
                                          .foregroundColor(.white)
                                      }
                                  }
                                  Section(header: Text("معلومات الشهادة")) {
                                      HStack {
                                          Text("الحالة:")
                                          Spacer()
                                          Text(isCertValid ? "جاهزة ومفعلة" : "غير مفعلة")
                                              .foregroundColor(isCertValid ? .green : .red)
                                      }
                                  }
                              }
                              .navigationBarTitle("الإعدادات", displayMode: .large)
                          }
                          .tag(2)

                          // 4. المكتبة
                          NavigationView {
                              VStack {
                                  Button(action: { showFileImporter = true }) {
                                      HStack {
                                          Image(systemName: "folder.badge.plus")
                                          Text("إضافة IPA من الملفات")
                                      }
                                      .font(.system(size: 16, weight: .bold))
                                      .frame(maxWidth: .infinity)
                                      .padding(.vertical, 14)
                                      .background(Color.green)
                                      .foregroundColor(.white)
                                      .cornerRadius(16)
                                  }
                                  .padding()

                                  if libraryApps.isEmpty {
                                      Spacer()
                                      Text("المكتبة فارغة حالياً.")
                                          .foregroundColor(.gray)
                                          .font(.system(size: 16))
                                      Spacer()
                                  } else {
                                      List(libraryApps) { app in
                                          HStack {
                                              VStack(alignment: .leading, spacing: 4) {
                                                  Text(app.name).font(.system(size: 16, weight: .bold)).foregroundColor(.white)
                                                  Text(app.bundleID).font(.system(size: 12)).foregroundColor(.gray)
                                              }
                                              Spacer()
                                              Button("توقيع وتثبيت") {
                                                  // تنشيط عملية التوقيع
                                              }
                                              .font(.system(size: 13, weight: .bold))
                                              .padding(.horizontal, 12)
                                              .padding(.vertical, 6)
                                              .background(Color.blue)
                                              .foregroundColor(.white)
                                              .cornerRadius(12)
                                          }
                                          .listRowBackground(Color.clear)
                                      }
                                      .listStyle(PlainListStyle())
                                  }
                              }
                              .navigationBarTitle("المكتبة", displayMode: .large)
                          }
                          .tag(3)

                          // 5. حول
                          NavigationView {
                              ScrollView {
                                  VStack(spacing: 25) {
                                      ZStack {
                                          RoundedRectangle(cornerRadius: 30)
                                              .fill(LinearGradient(gradient: Gradient(colors: [.blue, .purple]), startPoint: .topLeading, endPoint: .bottomTrailing))
                                              .frame(width: 110, height: 110)
                                          Text("SRT").font(.system(size: 40, weight: .black)).foregroundColor(.white)
                                      }
                                      .padding(.top, 30)

                                      VStack(spacing: 8) {
                                          Text("SRT STORE").font(.system(size: 30, weight: .bold))
                                          Text("المطور: موحي العماري").font(.title3).foregroundColor(.gray)
                                      }

                                      VStack(spacing: 14) {
                                          Button(action: {
                                              if let url = URL(string: "https://t.me/evv2g") { UIApplication.shared.open(url) }
                                          }) {
                                              HStack {
                                                  Image(systemName: "paperplane.fill")
                                                  Text("تليجرام (evv2g)")
                                              }
                                              .font(.system(size: 16, weight: .semibold))
                                              .frame(maxWidth: .infinity)
                                              .padding(.vertical, 14)
                                              .background(Color.blue)
                                              .foregroundColor(.white)
                                              .cornerRadius(20)
                                          }

                                          Button(action: {
                                              if let url = URL(string: "https://www.tiktok.com/@l6899l?_r=1&_t=ZS-9AkraJK00Zj") { UIApplication.shared.open(url) }
                                          }) {
                                              HStack {
                                                  Image(systemName: "video.fill")
                                                  Text("تيك توك")
                                              }
                                              .font(.system(size: 16, weight: .semibold))
                                              .frame(maxWidth: .infinity)
                                              .padding(.vertical, 14)
                                              .background(Color(white: 0.2))
                                              .foregroundColor(.white)
                                              .cornerRadius(20)
                                          }
                                      }
                                      .padding(.horizontal)
                                  }
                              }
                              .navigationBarTitle("حول", displayMode: .large)
                          }
                          .tag(4)
                      }
                      .accentColor(.blue)
                      .preferredColorScheme(.dark)

                      // شريط تنقل سفلي عائم بتصميم خفيف
                      HStack {
                          TabBarButton(icon: "square.stack.3d.up.fill", title: "App Store", tag: 0, selection: $selectedTab)
                          TabBarButton(icon: "pencil.tip.crop.circle", title: "توقيع", tag: 1, selection: $selectedTab)
                          TabBarButton(icon: "gearshape.fill", title: "الإعدادات", tag: 2, selection: $selectedTab)
                          TabBarButton(icon: "books.vertical.fill", title: "المكتبة", tag: 3, selection: $selectedTab)
                          TabBarButton(icon: "person.fill", title: "حول", tag: 4, selection: $selectedTab)
                      }
                      .padding(.vertical, 12)
                      .padding(.horizontal, 10)
                      .background(.ultraThinMaterial)
                      .cornerRadius(30)
                      .overlay(
                          RoundedRectangle(cornerRadius: 30)
                              .stroke(Color.white.opacity(0.15), lineWidth: 0.5)
                      )
                      .padding(.horizontal, 16)
                      .padding(.bottom, 12)
                  }
                  .edgesIgnoringSafeArea(.bottom)
                  .sheet(isPresented: $showSourcesModal) {
                      SourcesModalView(sourcesList: $sourcesList, availableApps: $availableApps)
                  }
                  .sheet(isPresented: $showCertModal) {
                      CertificateModalView(
                          p12Name: $p12FileName,
                          provName: $mobileProvFileName,
                          passwordInput: $certPasswordInput,
                          certStatusMessage: $certStatusMessage,
                          isCertValid: $isCertValid
                      )
                  }
                  .fileImporter(isPresented: $showFileImporter, allowedContentTypes: [UTType.item]) { result in
                      if case .success(let url) = result {
                          let customApp = AppItem(name: url.lastPathComponent, bundleID: "com.local.app", version: "1.0", size: "30 MB", iconURL: "", downloadURL: url.absoluteString)
                          libraryApps.append(customApp)
                      }
                  }
              }

              var filteredApps: [AppItem] {
                  if searchText.isEmpty { return availableApps }
                  return availableApps.filter { $0.name.localizedCaseInsensitiveContains(searchText) }
              }
          }

          struct TabBarButton: View {
              let icon: String
              let title: String
              let tag: Int
              @Binding var selection: Int

              var body: some View {
                  Button(action: { selection = tag }) {
                      VStack(spacing: 4) {
                          Image(systemName: icon).font(.system(size: 20))
                          Text(title).font(.system(size: 11, weight: .medium))
                      }
                      .foregroundColor(selection == tag ? .blue : .gray)
                      .frame(maxWidth: .infinity)
                  }
              }
          }

          struct SourcesModalView: View {
              @Binding var sourcesList: [AppSource]
              @Binding var availableApps: [AppItem]
              @State private var sourceURL = ""
              @Environment(\.dismiss) var dismiss

              var body: some View {
                  NavigationView {
                      VStack(spacing: 20) {
                          TextField("أدخل رابط السورس (JSON)", text: $sourceURL)
                              .padding()
                              .background(Color(white: 0.15))
                              .cornerRadius(12)

                          Button("إضافة وجلب التطبيقات") {
                              guard let url = URL(string: sourceURL) else { return }
                              URLSession.shared.dataTask(with: url) { data, _, _ in
                                  if let data = data, let decoded = try? JSONDecoder().decode([String: [AppItem]].self, from: data) {
                                      let apps = decoded["apps"] ?? decoded["applications"] ?? []
                                      DispatchQueue.main.async {
                                          availableApps.append(contentsOf: apps)
                                          sourcesList.append(AppSource(name: "سورس", url: sourceURL, appCount: apps.count))
                                          dismiss()
                                      }
                                  }
                              }.resume()
                          }
                          .fontWeight(.bold)
                          .frame(maxWidth: .infinity)
                          .padding()
                          .background(Color.blue)
                          .foregroundColor(.white)
                          .cornerRadius(20)

                          Spacer()
                      }
                      .padding()
                      .navigationBarTitle("إضافة سورس جديد", displayMode: .inline)
                  }
              }
          }

          struct CertificateModalView: View {
              @Binding var p12Name: String
              @Binding var provName: String
              @Binding var passwordInput: String
              @Binding var certStatusMessage: String
              @Binding var isCertValid: Bool
              @Environment(\.dismiss) var dismiss

              var body: some View {
                  NavigationView {
                      VStack(spacing: 20) {
                          Button("رفع ملف الشهادة (.p12)") {
                              p12Name = "cert.p12"
                          }
                          .padding()
                          .frame(maxWidth: .infinity)
                          .background(Color(white: 0.15))
                          .foregroundColor(.white)
                          .cornerRadius(12)

                          Button("رفع ملف التعريف (.mobileprovision)") {
                              provName = "cert.mobileprovision"
                          }
                          .padding()
                          .frame(maxWidth: .infinity)
                          .background(Color(white: 0.15))
                          .foregroundColor(.white)
                          .cornerRadius(12)

                          SecureField("أدخل كلمة سر الشهادة", text: $passwordInput)
                              .padding()
                              .background(Color(white: 0.15))
                              .cornerRadius(12)

                          Button("التحقق وتفعيل الشهادة") {
                              if !passwordInput.isEmpty {
                                  isCertValid = true
                                  certStatusMessage = "الشهادة جاهزة وشغالة بنجاح."
                                  dismiss()
                              }
                          }
                          .fontWeight(.bold)
                          .frame(maxWidth: .infinity)
                          .padding()
                          .background(Color.green)
                          .foregroundColor(.white)
                          .cornerRadius(20)

                          Spacer()
                      }
                      .padding()
                      .navigationBarTitle("إدارة الشهادة", displayMode: .inline)
                  }
              }
          }

          _ = UIApplicationMain(CommandLine.argc, CommandLine.unsafeArgv, nil, NSStringFromClass(AppDelegate.self))
          EOF

          xcrun --sdk iphoneos swiftc -target arm64-apple-ios16.0 main.swift -o build/Payload/${APP_NAME}.app/${APP_NAME}

          cat << 'EOF' > build/Payload/${APP_NAME}.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.srtttt7.srtstore</string>
              <key>CFBundleName</key>
              <string>SRTStore</string>
              <key>CFBundleDisplayName</key>
              <string>SRT STORE</string>
              <key>CFBundleExecutable</key>
              <string>SRTStore</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>MinimumOSVersion</key>
              <string>16.0</string>
              <key>UIRequiredDeviceCapabilities</key>
              <array><string>arm64</string></array>
              <key>UIDeviceFamily</key>
              <array><integer>1</integer><integer>2</integer></array>
          </dict>
          </plist>
          EOF

          cd build
          zip -r SRTStore.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SRTStore-IPA
          path: build/SRTStore.ipa
