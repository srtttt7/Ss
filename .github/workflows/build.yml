name: Build SRT Store IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Create IPA Structure Directly
        run: |
          mkdir -p build/Payload/SRTStore.app
          echo "APPL????" > build/Payload/SRTStore.app/PkgInfo
          
          # إذا وُجد ملف ContentView.swift يتم نسخه داخل الحزمة
          if [ -f "ContentView.swift" ]; then
            cp ContentView.swift build/Payload/SRTStore.app/
          fi

          cd build
          zip -r SRTStore.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SRTStore-IPA
          path: build/SRTStore.ipa
