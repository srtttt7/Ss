name: Build SRT Store IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Compile Full SRT Store App & Build IPA
        run: |
          APP_NAME="SRTStore"
          BUNDLE_ID="com.srtttt7.srtstore"
          
          mkdir -p build/Payload/${APP_NAME}.app
          echo "APPL????" > build/Payload/${APP_NAME}.app/PkgInfo

          cat << 'EOF' > main.swift
          import UIKit
          import SwiftUI

          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?

              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  let window = UIWindow(frame: UIScreen.main.bounds)
                  let rootView = ContentView()
                  window.rootViewController = UIHostingController(rootView: rootView)
                  self.window = window
                  window.makeKeyAndVisible()
                  return true
              }
          }

          struct AppItem: Identifiable, Codable {
              var id = UUID()
              let name: String
              let bundleID: String
              let version: String
              let size: String
              let iconURL: String
              let downloadURL: String
          }

          struct AppSource: Identifiable, Codable {
              var id = UUID()
              let name: String
              let url: String
              let appCount: Int
          }

          struct ContentView: View {
              @State private var selectedTab = 0
              @State private var searchText = ""
              @State private var availableApps: [AppItem] = []
              @State private var libraryApps: [AppItem] = []
              @State private var sourcesList: [AppSource] = []
              
              @State private var showSourcesModal = false
              @State private var showCertModal = false
              
              @State private var hasP12 = false
              @State private var hasMobileProvision = false
              @State private var certPasswordInput = ""
              @State private var certStatusMessage = "لم يتم رفع الشهادة بعد"
              @State private var isCertValid = false

              var body: some View {
                  TabView(selection: $selectedTab) {
                      NavigationView {
                          VStack {
                              HStack(spacing: 12) {
                                  Button(action: { showSourcesModal = true }) {
                                      HStack {
                                          Image(systemName: "plus.circle.fill")
                                          Text("إضافة سورس")
                                      }
                                      .font(.system(size: 14, weight: .bold))
                                      .padding(.horizontal, 14)
                                      .padding(.vertical, 10)
                                      .background(Color.blue)
                                      .foregroundColor(.white)
                                      .cornerRadius(12)
                                  }

                                  HStack {
                                      Image(systemName: "magnifyingglass")
                                          .foregroundColor(.gray)
                                      TextField("بحث في التطبيقات...", text: $searchText)
                                          .foregroundColor(.white)
                                  }
                                  .padding(10)
                                  .background(Color(white: 0.15))
                                  .cornerRadius(12)
                              }
                              .padding(.horizontal)

                              if filteredApps.isEmpty {
                                  Spacer()
                                  VStack(spacing: 12) {
                                      Image(systemName: "square.stack.3d.up.slash")
                                          .font(.system(size: 50))
                                          .foregroundColor(.gray)
                                      Text("قائمة التطبيقات فارغة")
                                          .font(.headline)
                                          .foregroundColor(.white)
                                      Text("قم بإضافة سورس جديد من زر 'إضافة' بالأعلى.")
                                          .font(.subheadline)
                                          .foregroundColor(.gray)
                                          .multilineTextAlignment(.center)
                                  }
                                  Spacer()
                              } else {
                                  List(filteredApps) { app in
                                      HStack(spacing: 14) {
                                          VStack(alignment: .leading, spacing: 4) {
                                              Text(app.name)
                                                  .font(.system(size: 16, weight: .semibold))
                                                  .foregroundColor(.white)
                                              Text("\(app.version) • \(app.size)")
                                                  .font(.system(size: 13))
                                                  .foregroundColor(.gray)
                                          }

                                          Spacer()

                                          Button(action: {
                                              if !libraryApps.contains(where: { $0.id == app.id }) {
                                                  libraryApps.append(app)
                                              }
                                              selectedTab = 3
                                          }) {
                                              Text("تحميل")
                                                  .font(.system(size: 14, weight: .bold))
                                                  .padding(.horizontal, 16)
                                                  .padding(.vertical, 8)
                                                  .background(Color.blue)
                                                  .foregroundColor(.white)
                                                  .cornerRadius(20)
                                          }
                                      }
                                      .listRowBackground(Color.clear)
                                  }
                                  .listStyle(PlainListStyle())
                              }
                          }
                          .navigationBarTitle("التطبيقات")
                      }
                      .tabItem {
                          Image(systemName: "square.stack.3d.up.fill")
                          Text("App Store")
                      }
                      .tag(0)

                      NavigationView {
                          VStack(spacing: 20) {
                              Text("أداة التوقيع والاستيراد")
                                  .font(.title2)
                                  .bold()
                                  .padding(.top, 20)
                              Spacer()
                          }
                          .navigationBarTitle("توقيع")
                      }
                      .tabItem {
                          Image(systemName: "pencil.tip.crop.circle")
                          Text("توقيع")
                      }
                      .tag(1)

                      NavigationView {
                          List {
                              Section(header: Text("إدارة الشهادة")) {
                                  Button(action: { showCertModal = true }) {
                                      HStack {
                                          Text("شهادة التوقيع (.p12)")
                                          Spacer()
                                          Image(systemName: "chevron.left").foregroundColor(.gray)
                                      }
                                      .foregroundColor(.white)
                                  }
                              }
                          }
                          .navigationBarTitle("الإعدادات")
                      }
                      .tabItem {
                          Image(systemName: "gearshape.fill")
                          Text("الإعدادات")
                      }
                      .tag(2)

                      NavigationView {
                          VStack {
                              if libraryApps.isEmpty {
                                  Spacer()
                                  Text("المكتبة فارغة حالياً.").foregroundColor(.gray)
                                  Spacer()
                              }
                          }
                          .navigationBarTitle("المكتبة")
                      }
                      .tabItem {
                          Image(systemName: "books.vertical.fill")
                          Text("المكتبة")
                      }
                      .tag(3)

                      NavigationView {
                          ScrollView {
                              VStack(spacing: 20) {
                                  ZStack {
                                      RoundedRectangle(cornerRadius: 25)
                                          .fill(LinearGradient(gradient: Gradient(colors: [.blue, .purple]), startPoint: .topLeading, endPoint: .bottomTrailing))
                                          .frame(width: 100, height: 100)
                                      Text("SRT").font(.system(size: 36, weight: .black)).foregroundColor(.white)
                                  }
                                  .padding(.top, 20)

                                  VStack(spacing: 6) {
                                      Text("SRT STORE").font(.title).bold()
                                      Text("المطور: موحي العماري").font(.headline).foregroundColor(.gray)
                                  }

                                  VStack(spacing: 12) {
                                      Button(action: {
                                          if let url = URL(string: "https://t.me/evv2g") { UIApplication.shared.open(url) }
                                      }) {
                                          HStack {
                                              Image(systemName: "paperplane.fill")
                                              Text("تليجرام (evv2g)")
                                          }
                                          .frame(maxWidth: .infinity).padding().background(Color.blue).foregroundColor(.white).cornerRadius(20)
                                      }

                                      Button(action: {
                                          if let url = URL(string: "https://www.tiktok.com/@l6899l?_r=1&_t=ZS-9AkraJK00Zj") { UIApplication.shared.open(url) }
                                      }) {
                                          HStack {
                                              Image(systemName: "video.fill")
                                              Text("تيك توك")
                                          }
                                          .frame(maxWidth: .infinity).padding().background(Color.gray).foregroundColor(.white).cornerRadius(20)
                                      }
                                  }
                                  .padding(.horizontal)
                              }
                          }
                          .navigationBarTitle("حول")
                      }
                      .tabItem {
                          Image(systemName: "person.fill")
                          Text("حول")
                      }
                      .tag(4)
                  }
                  .accentColor(.blue)
                  .preferredColorScheme(.dark)
              }

              var filteredApps: [AppItem] {
                  if searchText.isEmpty { return availableApps }
                  return availableApps.filter { $0.name.localizedCaseInsensitiveContains(searchText) }
              }
          }

          // نقطة الدخول التقليدية للتطبيق (بدون أخطاء @main)
          _ = UIApplicationMain(CommandLine.argc, CommandLine.unsafeArgv, nil, NSStringFromClass(AppDelegate.self))
          EOF

          xcrun --sdk iphoneos swiftc -target arm64-apple-ios16.0 main.swift -o build/Payload/${APP_NAME}.app/${APP_NAME}

          cat << 'EOF' > build/Payload/${APP_NAME}.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.srtttt7.srtstore</string>
              <key>CFBundleName</key>
              <string>SRTStore</string>
              <key>CFBundleDisplayName</key>
              <string>SRT STORE</string>
              <key>CFBundleExecutable</key>
              <string>SRTStore</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>MinimumOSVersion</key>
              <string>16.0</string>
              <key>UIRequiredDeviceCapabilities</key>
              <array>
                  <string>arm64</string>
              </array>
              <key>UIDeviceFamily</key>
              <array>
                  <integer>1</integer>
                  <integer>2</integer>
              </array>
          </dict>
          </plist>
          EOF

          cd build
          zip -r SRTStore.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SRTStore-IPA
          path: build/SRTStore.ipa
