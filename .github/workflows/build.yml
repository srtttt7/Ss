name: Build SRT Store IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build App Payload Directly
        run: |
          mkdir -p build/Payload/SRTStore.app
          echo "APPL????" > build/Payload/SRTStore.app/PkgInfo
          
          # إنشاء Info.plist أساسي للتطبيق
          cat << 'EOF' > build/Payload/SRTStore.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.srtttt7.srtstore</string>
              <key>CFBundleName</key>
              <string>SRTStore</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>MinimumOSVersion</key>
              <string>15.0</string>
          </dict>
          </dict>
          </plist>
          EOF

          # نسخ واجهة المتجر إذا وجدت
          if [ -f "SRTStore/ContentView.swift" ]; then
            cp SRTStore/ContentView.swift build/Payload/SRTStore.app/
          elif [ -f "ContentView.swift" ]; then
            cp ContentView.swift build/Payload/SRTStore.app/
          fi

          cd build
          zip -r SRTStore.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SRTStore-IPA
          path: build/SRTStore.ipa
