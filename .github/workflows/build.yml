name: Build SRT Store IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-14

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: 'latest-stable'

      - name: Compile Full SRT Store App & Build IPA
        run: |
          APP_NAME="SRTStore"
          BUNDLE_ID="com.srtttt7.srtstore"
          
          mkdir -p build/Payload/${APP_NAME}.app
          echo "APPL????" > build/Payload/${APP_NAME}.app/PkgInfo

          mkdir -p Assets.xcassets/AppIcon.appiconset
          cat << 'EOF' > Assets.xcassets/AppIcon.appiconset/Contents.json
          {
            "images" : [
              { "idiom" : "iphone", "size" : "60x60", "scale" : "2x" },
              { "idiom" : "iphone", "size" : "60x60", "scale" : "3x" }
            ],
            "info" : { "author" : "xcode", "version" : 1 }
          }
          EOF

          actool Assets.xcassets \
            --compile build/Payload/${APP_NAME}.app \
            --platform iphoneos \
            --minimum-deployment-target 18.0 \
            --app-icon AppIcon \
            --output-partial-info-plist build/partial.plist

          cat << 'EOF' > main.swift
          import UIKit
          import SwiftUI
          import UniformTypeIdentifiers

          class AppDelegate: UIResponder, UIApplicationDelegate {
              var window: UIWindow?

              func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
                  let window = UIWindow(frame: UIScreen.main.bounds)
                  let rootView = ContentView()
                  window.rootViewController = UIHostingController(rootView: rootView)
                  self.window = window
                  window.makeKeyAndVisible()
                  return true
              }
          }

          struct AppItem: Identifiable, Codable {
              var id = UUID()
              var name: String
              var bundleID: String
              var version: String
              var size: String
              var iconURL: String
              var downloadURL: String

              enum CodingKeys: String, CodingKey {
                  case name, version, size
                  case bundleID = "bundleIdentifier"
                  case iconURL = "icon"
                  case downloadURL = "downloadURL"
              }
          }

          struct AltStoreApp: Codable {
              let name: String
              let bundleIdentifier: String
              let version: String
              let size: Int?
              let iconURL: String?
              let downloadURL: String
          }

          struct AltStoreRepo: Codable {
              let name: String?
              let apps: [AltStoreApp]?
          }

          struct AppSource: Identifiable, Codable {
              var id = UUID()
              let name: String
              let url: String
              let appCount: Int
          }

          extension Color {
              static let darkBg = Color(red: 0.05, green: 0.05, blue: 0.12)
              static let cardBg = Color(red: 0.10, green: 0.10, blue: 0.20)
              static let primaryPurple = Color(red: 0.45, green: 0.25, blue: 0.85)
              static let primaryBlue = Color(red: 0.15, green: 0.45, blue: 0.95)
          }

          struct ContentView: View {
              @State private var selectedTab = 0
              @State private var searchText = ""
              
              @State private var availableApps: [AppItem] = [
                  AppItem(name: "SkyGuide", bundleID: "com.fifthstarlabs.skyguide", version: "11.0", size: "120 MB", iconURL: "", downloadURL: "https://fastsign.dev/apps/skyguide.ipa"),
                  AppItem(name: "Textastic", bundleID: "com.textasticapp.textastic", version: "10.2", size: "38.5 MB", iconURL: "", downloadURL: "https://fastsign.dev/apps/textastic.ipa"),
                  AppItem(name: "Hevy", bundleID: "com.hevy.app", version: "2.1", size: "45 MB", iconURL: "", downloadURL: "https://fastsign.dev/apps/hevy.ipa"),
                  AppItem(name: "Yazio", bundleID: "com.yazio.android", version: "7.8", size: "62 MB", iconURL: "", downloadURL: "https://fastsign.dev/apps/yazio.ipa"),
                  AppItem(name: "PeakVisor", bundleID: "com.routes.peakvisor", version: "4.5", size: "90 MB", iconURL: "", downloadURL: "https://fastsign.dev/apps/peakvisor.ipa"),
                  AppItem(name: "Habits", bundleID: "com.habits.app", version: "3.0", size: "22 MB", iconURL: "", downloadURL: "https://fastsign.dev/apps/habits.ipa"),
                  AppItem(name: "Drafts", bundleID: "com.agiletortoise.Drafts5", version: "35.1", size: "55 MB", iconURL: "", downloadURL: "https://fastsign.dev/apps/drafts.ipa")
              ]
              
              @State private var libraryApps: [AppItem] = []
              @State private var sourcesList: [AppSource] = [
                  AppSource(name: "FastSign Repo", url: "https://fastsign.dev/repo.json", appCount: 7)
              ]
              
              @State private var showSourcesModal = false
              @State private var showCertModal = false
              @State private var showIPAPicker = false
              @State private var showP12Picker = false
              @State private var showProvPicker = false
              
              @State private var selectedAppToEdit: AppItem? = nil
              
              @State private var p12Name = "لم يتم الرفع"
              @State private var provName = "لم يتم الرفع"
              @State private var certPassword = ""
              @State private var isCertValid = false

              init() {
                  UITabBar.appearance().isHidden = true
              }

              var body: some View {
                  ZStack(alignment: .bottom) {
                      Color.darkBg.ignoresSafeArea()

                      VStack(spacing: 0) {
                          if selectedTab == 0 {
                              NavigationView {
                                  ZStack {
                                      Color.darkBg.ignoresSafeArea()
                                      VStack(spacing: 14) {
                                          HStack {
                                              Image(systemName: "magnifyingglass").foregroundColor(.gray)
                                              TextField("ألعاب وتطبيقات والمزيد", text: $searchText)
                                                  .foregroundColor(.white)
                                          }
                                          .padding(14)
                                          .background(Color.cardBg)
                                          .cornerRadius(18)
                                          .padding(.horizontal)

                                          ScrollView {
                                              VStack(spacing: 12) {
                                                  ForEach(filteredApps) { app in
                                                      HStack(spacing: 15) {
                                                          ZStack {
                                                              RoundedRectangle(cornerRadius: 16)
                                                                  .fill(LinearGradient(colors: [.primaryBlue, .primaryPurple], startPoint: .topLeading, endPoint: .bottomTrailing))
                                                                  .frame(width: 55, height: 55)
                                                              Text(String(app.name.prefix(1)))
                                                                  .font(.title2).bold().foregroundColor(.white)
                                                          }

                                                          VStack(alignment: .leading, spacing: 4) {
                                                              Text(app.name)
                                                                  .font(.system(size: 17, weight: .bold))
                                                                  .foregroundColor(.white)
                                                              Text("\(app.version) • \(app.size)")
                                                                  .font(.system(size: 13))
                                                                  .foregroundColor(.gray)
                                                          }

                                                          Spacer()

                                                          Button(action: {
                                                              if !libraryApps.contains(where: { $0.name == app.name }) {
                                                                  libraryApps.append(app)
                                                              }
                                                              selectedTab = 1
                                                          }) {
                                                              Text("تثبيت")
                                                                  .font(.system(size: 15, weight: .bold))
                                                                  .padding(.horizontal, 20)
                                                                  .padding(.vertical, 8)
                                                                  .background(Color.primaryBlue)
                                                                  .foregroundColor(.white)
                                                                  .cornerRadius(20)
                                                          }
                                                      }
                                                      .padding()
                                                      .background(Color.cardBg)
                                                      .cornerRadius(20)
                                                      .padding(.horizontal)
                                                  }
                                              }
                                              .padding(.bottom, 100)
                                          }
                                      }
                                  }
                                  .navigationBarTitle("التطبيقات", displayMode: .large)
                              }
                          } else if selectedTab == 1 {
                              NavigationView {
                                  ZStack {
                                      Color.darkBg.ignoresSafeArea()
                                      ScrollView {
                                          VStack(spacing: 16) {
                                              VStack(spacing: 10) {
                                                  Button(action: { showIPAPicker = true }) {
                                                      HStack {
                                                          Text("استيراد من الملفات")
                                                          Spacer()
                                                          Image(systemName: "chevron.left").foregroundColor(.gray)
                                                      }
                                                      .padding().background(Color.cardBg).foregroundColor(.white).cornerRadius(16)
                                                  }

                                                  Button(action: { showSourcesModal = true }) {
                                                      HStack {
                                                          Text("استيراد من رابط")
                                                          Spacer()
                                                          Image(systemName: "chevron.left").foregroundColor(.gray)
                                                      }
                                                      .padding().background(Color.cardBg).foregroundColor(.white).cornerRadius(16)
                                                  }
                                              }
                                              .padding(.horizontal)

                                              Text("التطبيقات").font(.caption).foregroundColor(.gray).frame(maxWidth: .infinity, alignment: .leading).padding(.horizontal)

                                              ForEach(libraryApps) { app in
                                                  Button(action: { selectedAppToEdit = app }) {
                                                      HStack(spacing: 15) {
                                                          ZStack {
                                                              RoundedRectangle(cornerRadius: 14)
                                                                  .fill(Color.primaryPurple)
                                                                  .frame(width: 48, height: 48)
                                                              Text(String(app.name.prefix(1)))
                                                                  .font(.title3).bold().foregroundColor(.white)
                                                          }

                                                          VStack(alignment: .leading, spacing: 4) {
                                                              Text(app.name).font(.system(size: 16, weight: .bold)).foregroundColor(.white)
                                                              Text("جاهز للتعديل والتوقيع").font(.system(size: 13)).foregroundColor(.gray)
                                                          }
                                                          Spacer()
                                                          Image(systemName: "chevron.left").foregroundColor(.gray)
                                                      }
                                                      .padding()
                                                      .background(Color.cardBg)
                                                      .cornerRadius(18)
                                                      .padding(.horizontal)
                                                  }
                                              }
                                          }
                                          .padding(.bottom, 100)
                                      }
                                  }
                                  .navigationBarTitle("توقيع", displayMode: .large)
                              }
                          } else if selectedTab == 2 {
                              NavigationView {
                                  ZStack {
                                      Color.darkBg.ignoresSafeArea()
                                      List {
                                          Section {
                                              Button(action: { showCertModal = true }) {
                                                  HStack {
                                                      Text("الشهادة").foregroundColor(.white)
                                                      Spacer()
                                                      Image(systemName: "chevron.left").foregroundColor(.gray)
                                                  }
                                              }
                                              HStack {
                                                  Text("اللغة").foregroundColor(.white)
                                                  Spacer()
                                                  Text("العربية").foregroundColor(.gray)
                                              }
                                          } .listRowBackground(Color.cardBg)

                                          Section {
                                              Button("إعدادات التطبيق") {}.foregroundColor(.white)
                                              Button("مفضلتي") {}.foregroundColor(.white)
                                              Button("مصادر التطبيقات") { showSourcesModal = true }.foregroundColor(.white)
                                              Button("التحديثات") {}.foregroundColor(.white)
                                              Button("مكتبة التطبيقات") {}.foregroundColor(.white)
                                          } .listRowBackground(Color.cardBg)

                                          Section {
                                              Button("تنظيف الملفات") {}.foregroundColor(.red)
                                          } .listRowBackground(Color.cardBg)
                                      }
                                      .scrollContentBackground(.hidden)
                                      .padding(.bottom, 100)
                                  }
                                  .navigationBarTitle("الإعدادات", displayMode: .large)
                              }
                          } else {
                              NavigationView {
                                  ZStack {
                                      Color.darkBg.ignoresSafeArea()
                                      VStack(spacing: 25) {
                                          VStack(spacing: 15) {
                                              ZStack {
                                                  RoundedRectangle(cornerRadius: 28)
                                                      .fill(LinearGradient(colors: [.primaryBlue, .primaryPurple], startPoint: .topLeading, endPoint: .bottomTrailing))
                                                      .frame(width: 90, height: 90)
                                                  Text("S")
                                                      .font(.system(size: 50, weight: .black, design: .rounded))
                                                      .foregroundColor(.white)
                                              }

                                              Text("SRT STORE")
                                                  .font(.title).bold().foregroundColor(.white)

                                              Text("المطور\nموحي العماري")
                                                  .font(.headline)
                                                  .foregroundColor(.gray)
                                                  .multilineTextAlignment(.center)

                                              Text("أداة متخصصة لتوقيع وتثبيت تطبيقات IPA مباشرة من جهازك")
                                                  .font(.subheadline)
                                                  .foregroundColor(.gray)
                                                  .multilineTextAlignment(.center)
                                                  .padding(.horizontal)
                                          }
                                          .padding()
                                          .frame(maxWidth: .infinity)
                                          .background(Color.cardBg)
                                          .cornerRadius(24)
                                          .padding(.horizontal)

                                          VStack(spacing: 12) {
                                              Text("تواصل مع المطور").font(.headline).foregroundColor(.white)
                                              HStack(spacing: 15) {
                                                  Button(action: {
                                                      if let url = URL(string: "https://t.me/evv2g") { UIApplication.shared.open(url) }
                                                  }) {
                                                      HStack {
                                                          Image(systemName: "paperplane.fill")
                                                          Text("Telegram")
                                                      }
                                                      .font(.system(size: 15, weight: .bold))
                                                      .frame(maxWidth: .infinity)
                                                      .padding(.vertical, 14)
                                                      .background(Color.primaryBlue)
                                                      .foregroundColor(.white)
                                                      .cornerRadius(16)
                                                  }

                                                  Button(action: {
                                                      if let url = URL(string: "https://www.tiktok.com/@l6899l?_r=1&_t=ZS-9AkraJK00Zj") { UIApplication.shared.open(url) }
                                                  }) {
                                                      HStack {
                                                          Image(systemName: "video.fill")
                                                          Text("TikTok")
                                                      }
                                                      .font(.system(size: 15, weight: .bold))
                                                      .frame(maxWidth: .infinity)
                                                      .padding(.vertical, 14)
                                                      .background(Color.primaryPurple)
                                                      .foregroundColor(.white)
                                                      .cornerRadius(16)
                                                  }
                                              }
                                              .padding(.horizontal)
                                          }

                                          Spacer()
                                      }
                                      .padding(.top, 20)
                                      .padding(.bottom, 100)
                                  }
                                  .navigationBarTitle("حول", displayMode: .large)
                              }
                          }
                      }

                      HStack {
                          TabBarButton(icon: "square.stack.3d.up.fill", title: "التطبيقات", tag: 0, selection: $selectedTab)
                          TabBarButton(icon: "signature", title: "توقيع", tag: 1, selection: $selectedTab)
                          TabBarButton(icon: "gearshape.fill", title: "الإعدادات", tag: 2, selection: $selectedTab)
                          TabBarButton(icon: "person.fill", title: "حول", tag: 3, selection: $selectedTab)
                      }
                      .padding(.vertical, 12)
                      .padding(.horizontal, 10)
                      .background(Color.cardBg.opacity(0.95))
                      .cornerRadius(30)
                      .overlay(
                          RoundedRectangle(cornerRadius: 30)
                              .stroke(LinearGradient(colors: [.primaryBlue, .primaryPurple], startPoint: .leading, endPoint: .trailing), lineWidth: 1)
                      )
                      .padding(.horizontal, 16)
                      .padding(.bottom, 12)
                  }
                  .edgesIgnoringSafeArea(.all)
                  .sheet(isPresented: $showSourcesModal) {
                      SourcesModalView(sourcesList: $sourcesList, availableApps: $availableApps)
                  }
                  .sheet(isPresented: $showCertModal) {
                      CertificateModalView(
                          p12Name: $p12Name,
                          provName: $provName,
                          passwordInput: $certPassword,
                          isCertValid: $isCertValid,
                          showP12Picker: $showP12Picker,
                          showProvPicker: $showProvPicker
                      )
                  }
                  .sheet(item: $selectedAppToEdit) { app in
                      EditAppModalView(app: app)
                  }
                  .fileImporter(isPresented: $showIPAPicker, allowedContentTypes: [.item, .data]) { result in
                      if case .success(let url) = result {
                          let newApp = AppItem(name: url.deletingPathExtension().lastPathComponent, bundleID: "com.srt.custom", version: "1.0", size: "25 MB", iconURL: "", downloadURL: url.absoluteString)
                          libraryApps.append(newApp)
                      }
                  }
                  .fileImporter(isPresented: $showP12Picker, allowedContentTypes: [.item, .data]) { result in
                      if case .success(let url) = result {
                          p12Name = url.lastPathComponent
                      }
                  }
                  .fileImporter(isPresented: $showProvPicker, allowedContentTypes: [.item, .data]) { result in
                      if case .success(let url) = result {
                          provName = url.lastPathComponent
                      }
                  }
              }

              var filteredApps: [AppItem] {
                  if searchText.isEmpty { return availableApps }
                  return availableApps.filter { $0.name.localizedCaseInsensitiveContains(searchText) }
              }
          }

          struct TabBarButton: View {
              let icon: String
              let title: String
              let tag: Int
              @Binding var selection: Int

              var body: some View {
                  Button(action: { selection = tag }) {
                      VStack(spacing: 4) {
                          Image(systemName: icon).font(.system(size: 20))
                          Text(title).font(.system(size: 11, weight: .medium))
                      }
                      .foregroundColor(selection == tag ? .primaryBlue : .gray)
                      .frame(maxWidth: .infinity)
                  }
              }
          }

          struct SourcesModalView: View {
              @Binding var sourcesList: [AppSource]
              @Binding var availableApps: [AppItem]
              @State private var sourceURL = "https://fastsign.dev/repo.json"
              @Environment(\.dismiss) var dismiss

              var body: some View {
                  NavigationView {
                      ZStack {
                          Color.darkBg.ignoresSafeArea()
                          VStack(spacing: 20) {
                              TextField("أدخل رابط السورس (JSON)", text: $sourceURL)
                                  .padding()
                                  .background(Color.cardBg)
                                  .cornerRadius(14)
                                  .foregroundColor(.white)

                              Button("إضافة وجلب التطبيقات") {
                                  fetchRepo(urlStr: sourceURL)
                              }
                              .fontWeight(.bold)
                              .frame(maxWidth: .infinity)
                              .padding()
                              .background(Color.primaryBlue)
                              .foregroundColor(.white)
                              .cornerRadius(20)

                              Spacer()
                          }
                          .padding()
                      }
                      .navigationBarTitle("إضافة سورس جديد", displayMode: .inline)
                  }
              }

              func fetchRepo(urlStr: String) {
                  guard let url = URL(string: urlStr) else { return }
                  URLSession.shared.dataTask(with: url) { data, _, _ in
                      if let data = data, let repo = try? JSONDecoder().decode(AltStoreRepo.self, from: data) {
                          var newItems: [AppItem] = []
                          if let apps = repo.apps {
                              for a in apps {
                                  let sz = a.size != nil ? "\(a.size! / (1024*1024)) MB" : "45 MB"
                                  newItems.append(AppItem(name: a.name, bundleID: a.bundleIdentifier, version: a.version, size: sz, iconURL: a.iconURL ?? "", downloadURL: a.downloadURL))
                              }
                          }
                          DispatchQueue.main.async {
                              availableApps.append(contentsOf: newItems)
                              sourcesList.append(AppSource(name: repo.name ?? "سورس", url: urlStr, appCount: newItems.count))
                              dismiss()
                          }
                      } else {
                          DispatchQueue.main.async { dismiss() }
                      }
                  }.resume()
              }
          }

          struct CertificateModalView: View {
              @Binding var p12Name: String
              @Binding var provName: String
              @Binding var passwordInput: String
              @Binding var isCertValid: Bool
              @Binding var showP12Picker: Bool
              @Binding var showProvPicker: Bool
              @Environment(\.dismiss) var dismiss

              var body: some View {
                  NavigationView {
                      ZStack {
                          Color.darkBg.ignoresSafeArea()
                          VStack(spacing: 18) {
                              Button(action: { showP12Picker = true }) {
                                  HStack {
                                      Text("شهادة التوقيع (.p12):")
                                      Spacer()
                                      Text(p12Name).foregroundColor(.gray)
                                  }
                                  .padding().background(Color.cardBg).foregroundColor(.white).cornerRadius(14)
                              }

                              Button(action: { showProvPicker = true }) {
                                  HStack {
                                      Text("ملف التعريف (.mobileprovision):")
                                      Spacer()
                                      Text(provName).foregroundColor(.gray)
                                  }
                                  .padding().background(Color.cardBg).foregroundColor(.white).cornerRadius(14)
                              }

                              SecureField("أدخل كلمة سر الشهادة", text: $passwordInput)
                                  .padding()
                                  .background(Color.cardBg)
                                  .foregroundColor(.white)
                                  .cornerRadius(14)

                              Button("حفظ وتفعيل الشهادة") {
                                  isCertValid = true
                                  dismiss()
                              }
                              .fontWeight(.bold)
                              .frame(maxWidth: .infinity)
                              .padding()
                              .background(Color.primaryPurple)
                              .foregroundColor(.white)
                              .cornerRadius(20)

                              Spacer()
                          }
                          .padding()
                      }
                      .navigationBarTitle("إدارة الشهادة", displayMode: .inline)
                  }
              }
          }

          struct EditAppModalView: View {
              @State var app: AppItem
              @Environment(\.dismiss) var dismiss

              var body: some View {
                  NavigationView {
                      ZStack {
                          Color.darkBg.ignoresSafeArea()
                          ScrollView {
                              VStack(spacing: 20) {
                                  ZStack {
                                      RoundedRectangle(cornerRadius: 22)
                                          .fill(Color.cardBg)
                                          .frame(width: 80, height: 80)
                                      Image(systemName: "app.fill").font(.largeTitle).foregroundColor(.gray)
                                  }

                                  HStack(spacing: 15) {
                                      Button("الصور") {}.frame(maxWidth: .infinity).padding().background(Color.primaryBlue).foregroundColor(.white).cornerRadius(14)
                                      Button("الملفات") {}.frame(maxWidth: .infinity).padding().background(Color.green).foregroundColor(.white).cornerRadius(14)
                                  }

                                  VStack(spacing: 12) {
                                      TextField("اسم التطبيق", text: $app.name)
                                          .padding().background(Color.cardBg).foregroundColor(.white).cornerRadius(12)

                                      TextField("معرف الحزمة", text: $app.bundleID)
                                          .padding().background(Color.cardBg).foregroundColor(.white).cornerRadius(12)

                                      TextField("الإصدار", text: $app.version)
                                          .padding().background(Color.cardBg).foregroundColor(.white).cornerRadius(12)
                                  }

                                  HStack(spacing: 15) {
                                      Button("توقيع وثبيت") { dismiss() }
                                          .font(.bold(.body)())
                                          .frame(maxWidth: .infinity)
                                          .padding()
                                          .background(Color.primaryBlue)
                                          .foregroundColor(.white)
                                          .cornerRadius(16)

                                      Button("توقيع فقط") { dismiss() }
                                          .font(.bold(.body)())
                                          .frame(maxWidth: .infinity)
                                          .padding()
                                          .background(Color.primaryPurple)
                                          .foregroundColor(.white)
                                          .cornerRadius(16)
                                  }
                              }
                              .padding()
                          }
                      }
                      .navigationBarTitle("تعديل التطبيق", displayMode: .inline)
                  }
              }
          }

          _ = UIApplicationMain(CommandLine.argc, CommandLine.unsafeArgv, nil, NSStringFromClass(AppDelegate.self))
          EOF

          xcrun --sdk iphoneos swiftc -target arm64-apple-ios18.0 main.swift -o build/Payload/${APP_NAME}.app/${APP_NAME}

          cat << 'EOF' > build/Payload/${APP_NAME}.app/Info.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleIdentifier</key>
              <string>com.srtttt7.srtstore</string>
              <key>CFBundleName</key>
              <string>SRTStore</string>
              <key>CFBundleDisplayName</key>
              <string>SRT STORE</string>
              <key>CFBundleExecutable</key>
              <string>SRTStore</string>
              <key>CFBundleVersion</key>
              <string>1.0</string>
              <key>CFBundleShortVersionString</key>
              <string>1.0</string>
              <key>CFBundlePackageType</key>
              <string>APPL</string>
              <key>MinimumOSVersion</key>
              <string>18.0</string>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
              <key>UIFileSharingEnabled</key>
              <true/>
              <key>LSSupportsOpeningDocumentsInPlace</key>
              <true/>
              <key>UILaunchScreen</key>
              <dict/>
              <key>UIRequiredDeviceCapabilities</key>
              <array><string>arm64</string></array>
              <key>UIDeviceFamily</key>
              <array><integer>1</integer><integer>2</integer></array>
          </dict>
          </plist>
          EOF

          cd build
          zip -r SRTStore.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SRTStore-IPA
