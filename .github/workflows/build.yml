name: Build SRTStore IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Archive
        run: |
          # بناء المشروع مباشرة بدون XcodeGen
          xcodebuild -project SRTStore.xcodeproj \
            -scheme SRTStore \
            -configuration Release \
            -sdk iphoneos \
            -archivePath $PWD/build/SRTStore.xcarchive \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -r build/SRTStore.xcarchive/Products/Applications/*.app build/Payload/
          cd build
          zip -r SRTStore.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SRTStore-Unsigned-IPA
          path: build/SRTStore.ipa
